<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | SignMeUp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.2);
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.25rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: white;
            color: #4f46e5;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.125rem;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .suggestions {
            margin-top: 3rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            backdrop-filter: blur(10px);
        }

        .suggestions h2 {
            color: white;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .suggestions ul {
            list-style: none;
            text-align: left;
        }

        .suggestions li {
            color: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 0;
        }

        .suggestions a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .suggestions a:hover {
            border-bottom-color: white;
        }

        @media (max-width: 640px) {
            .error-code {
                font-size: 6rem;
            }

            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <div class="error-icon">🔍</div>
        <h1>Page Not Found</h1>
        <p>Oops! The page you're looking for doesn't exist. It might have been moved or deleted.</p>

        <div>
            <a href="index.html" class="btn">Go Home</a>
            <a href="events.html" class="btn btn-secondary">Browse Events</a>
        </div>

        <div class="suggestions">
            <h2>Popular Pages</h2>
            <ul>
                <li>🏠 <a href="index.html">Home</a></li>
                <li>📅 <a href="events.html">Browse Events</a></li>
                <li>👤 <a href="app.html">Login / Sign Up</a></li>
                <li>📊 <a href="dashboard.html">Dashboard</a></li>
                <li>ℹ️ <a href="about.html">About Us</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
