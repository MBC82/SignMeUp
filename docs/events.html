<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Events - SignMeUp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #1f2937;
            background-color: #f9fafb;
            min-height: 100vh;
        }

        .header {
            background-color: white;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #4f46e5;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-link {
            color: #1f2937;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #4f46e5;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .btn-secondary {
            background-color: transparent;
            color: #4f46e5;
            border: 2px solid #4f46e5;
        }

        .btn-secondary:hover {
            background-color: #4f46e5;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 1.125rem;
            color: #6b7280;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .event-card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .event-card-header {
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .event-card-header h3 {
            font-size: 1.25rem;
            flex: 1;
            margin-right: 1rem;
        }

        .event-status {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-available {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-limited {
            background-color: #fef3c7;
            color: #92400e;
        }

        .status-full {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .event-card-body {
            padding: 0 1.5rem 1.5rem;
        }

        .event-description {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .event-details {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .event-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-icon {
            font-size: 1.125rem;
        }

        .progress-bar {
            height: 0.5rem;
            background-color: #e5e7eb;
            border-radius: 0.25rem;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #0ea5e9);
            transition: width 0.3s ease;
        }

        .event-card-footer {
            padding: 0 1.5rem 1.5rem;
        }

        .event-card-footer .btn {
            width: 100%;
        }

        .btn:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .events-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <a href="index.html" class="logo">
                <span class="logo-icon">📝</span>
                SignMeUp
            </a>
            <div class="nav-links" id="nav-links">
                <!-- Will be populated by JS -->
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1>Upcoming Events</h1>
            <p>Browse and register for upcoming events</p>
        </div>

        <div class="events-grid" id="events-grid">
            <!-- Events will be loaded here -->
        </div>
    </div>

    <script>
        // Check if user is logged in
        function isLoggedIn() {
            return localStorage.getItem('signmeup_user') !== null;
        }

        // Update navigation based on auth state
        function updateNav() {
            const navLinks = document.getElementById('nav-links');
            if (isLoggedIn()) {
                const user = JSON.parse(localStorage.getItem('signmeup_user'));
                navLinks.innerHTML = `
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <span class="nav-link">${user.name || user.email}</span>
                    <button onclick="handleLogout()" class="btn btn-secondary">Logout</button>
                `;
            } else {
                navLinks.innerHTML = `
                    <a href="app.html" class="nav-link">Login</a>
                    <a href="app.html" class="btn btn-primary">Sign Up</a>
                `;
            }
        }

        // Handle logout
        function handleLogout() {
            if (confirm('Are you sure you want to log out?')) {
                localStorage.removeItem('signmeup_user');
                window.location.reload();
            }
        }

        // Format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return new Intl.DateTimeFormat('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            }).format(date);
        }

        // Handle registration
        function handleRegister(eventId) {
            if (!isLoggedIn()) {
                alert('Please log in to register for events');
                window.location.href = 'app.html';
                return;
            }

            if (confirm('Register for this event?')) {
                alert('✅ Successfully registered! Check your dashboard to see your upcoming events.');
                // In a real app, this would save to Firebase
            }
        }

        // Mock event data
        const mockEvents = [
            {
                id: 1,
                title: "Web Development Workshop 2026",
                description: "Learn modern web development with React, Node.js, and more. Perfect for beginners and intermediate developers.",
                date: "2026-07-15T10:00:00",
                location: "Tech Hub, San Francisco, CA",
                capacity: 50,
                registered: 35
            },
            {
                id: 2,
                title: "React Conference",
                description: "Join the largest React developer conference. Network with experts and learn about the latest React features.",
                date: "2026-08-22T09:00:00",
                location: "Convention Center, New York, NY",
                capacity: 500,
                registered: 487
            },
            {
                id: 3,
                title: "Startup Networking Event",
                description: "Connect with founders, investors, and entrepreneurs. Great opportunity to expand your network.",
                date: "2026-07-05T18:00:00",
                location: "Downtown Coworking, Austin, TX",
                capacity: 100,
                registered: 72
            },
            {
                id: 4,
                title: "UI/UX Design Masterclass",
                description: "Master the art of user interface and user experience design. Hands-on workshop with industry experts.",
                date: "2026-07-20T14:00:00",
                location: "Design Studio, Seattle, WA",
                capacity: 30,
                registered: 28
            },
            {
                id: 5,
                title: "Python for Data Science",
                description: "Deep dive into Python for data analysis, machine learning, and visualization.",
                date: "2026-08-10T10:00:00",
                location: "University Campus, Boston, MA",
                capacity: 60,
                registered: 45
            },
            {
                id: 6,
                title: "Mobile App Development Bootcamp",
                description: "Build iOS and Android apps from scratch. Learn React Native and Flutter.",
                date: "2026-09-01T09:00:00",
                location: "Tech Campus, San Jose, CA",
                capacity: 40,
                registered: 12
            }
        ];

        // Load and render events
        function loadEvents() {
            const eventsGrid = document.getElementById('events-grid');

            const eventsHTML = mockEvents.map(event => {
                const spotsLeft = event.capacity - event.registered;
                const percentFull = (event.registered / event.capacity) * 100;

                let statusClass = 'available';
                let statusText = `${spotsLeft} spots left`;

                if (spotsLeft === 0) {
                    statusClass = 'full';
                    statusText = 'Full';
                } else if (spotsLeft <= 5) {
                    statusClass = 'limited';
                    statusText = `Only ${spotsLeft} left!`;
                }

                return `
                    <div class="event-card">
                        <div class="event-card-header">
                            <h3>${event.title}</h3>
                            <span class="event-status status-${statusClass}">${statusText}</span>
                        </div>
                        <div class="event-card-body">
                            <p class="event-description">${event.description}</p>
                            <div class="event-details">
                                <div class="event-detail">
                                    <span class="detail-icon">📅</span>
                                    <span>${formatDate(event.date)}</span>
                                </div>
                                <div class="event-detail">
                                    <span class="detail-icon">📍</span>
                                    <span>${event.location}</span>
                                </div>
                                <div class="event-detail">
                                    <span class="detail-icon">👥</span>
                                    <span>${event.registered} / ${event.capacity} registered</span>
                                </div>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${Math.min(percentFull, 100)}%"></div>
                            </div>
                        </div>
                        <div class="event-card-footer">
                            <button
                                onclick="handleRegister(${event.id})"
                                class="btn btn-primary"
                                ${spotsLeft === 0 ? 'disabled' : ''}
                            >
                                ${spotsLeft === 0 ? 'Event Full' : 'Register Now'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            eventsGrid.innerHTML = eventsHTML;
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            updateNav();
            loadEvents();
        });
    </script>
</body>
</html>
